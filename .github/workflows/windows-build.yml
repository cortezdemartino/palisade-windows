name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned native toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Verify native guardian
        run: |
          npm run test:assist-native
          if ($LASTEXITCODE -ne 0) { throw 'Native verification failed.' }
          npm run build:assist
          if ($LASTEXITCODE -ne 0) { throw 'Native compilation failed.' }
          npm run test:assist-process
          if ($LASTEXITCODE -ne 0) { throw 'Native process verification failed.' }
      - name: Audit locked native dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          if ($LASTEXITCODE -ne 0) { throw 'Native audit tool unavailable.' }
          cargo audit --file native/assist/Cargo.lock --deny warnings
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency audit failed.' }
      - name: Run tests
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Retrieve pinned update manager
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manager = Get-Content assets/manager-release.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Path .manager -Force | Out-Null
          gh release download $manager.tag --repo $manager.repository --pattern $manager.filename --dir .manager --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Pinned update manager download failed.' }
          node -e "require('./scripts/bundle-manager.cjs').verifyManager(require('node:path').join('.manager', require('./assets/manager-release.json').filename)).catch(e => { console.error(e.message); process.exitCode = 1; })"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned update manager verification failed.' }
      - name: Build Windows installer
        run: npm run package:win
      - name: Verify packaged controls and permission boundaries
        run: |
          npm run verify:assist-package
          if ($LASTEXITCODE -ne 0) { throw 'Packaged native integrity verification failed.' }
          $env:PALISADE_WINDOW_SMOKE_ASAR = (Resolve-Path out/win-unpacked/resources/app.asar).Path
          try {
            npm run test:window-controls
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Electron checks failed.' }
          } finally { Remove-Item Env:PALISADE_WINDOW_SMOKE_ASAR -ErrorAction SilentlyContinue }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: palisade-windows-${{ github.sha }}
          path: out/Palisade-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
