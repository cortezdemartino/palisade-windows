name: Publish Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: palisade-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require protected release environment
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $rules = gh api "repos/$env:GITHUB_REPOSITORY/environments/release" --jq '.protection_rules | map(select(.type == "required_reviewers")) | length'
          if ($LASTEXITCODE -ne 0 -or [int]$rules -lt 1) { throw 'Configure required reviewers on the release environment before publishing.' }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check tagged version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw 'Git tag does not match the package version.'
          }
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned native toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Verify and audit native guardian
        shell: pwsh
        run: |
          npm run test:assist-native
          if ($LASTEXITCODE -ne 0) { throw 'Native verification failed.' }
          npm run build:assist
          if ($LASTEXITCODE -ne 0) { throw 'Native compilation failed.' }
          npm run test:assist-process
          if ($LASTEXITCODE -ne 0) { throw 'Native process verification failed.' }
          cargo install cargo-audit --locked --version 0.22.2
          if ($LASTEXITCODE -ne 0) { throw 'Native audit tool unavailable.' }
          cargo audit --file native/assist/Cargo.lock --deny warnings
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency audit failed.' }
      - name: Test and audit
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          npm run test:window-controls
          if ($LASTEXITCODE -ne 0) { throw 'Window controls verification failed.' }
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE -ne 0) { throw 'Dependency audit failed.' }
      - name: Retrieve pinned update manager
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manager = Get-Content assets/manager-release.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Path .manager -Force | Out-Null
          gh release download $manager.tag --repo $manager.repository --pattern $manager.filename --dir .manager --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Pinned update manager download failed.' }
          node -e "require('./scripts/bundle-manager.cjs').verifyManager(require('node:path').join('.manager', require('./assets/manager-release.json').filename)).catch(e => { console.error(e.message); process.exitCode = 1; })"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned update manager verification failed.' }
      - name: Build Windows installer
        shell: pwsh
        run: |
          npm run package:win
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $actual = (Get-Item -LiteralPath "out/Palisade-Setup-$version-x64.exe").VersionInfo.ProductVersion
          if ($actual -notin @($version, "$version.0")) { throw 'Installer version does not match the package.' }
      - name: Verify packaged window controls
        shell: pwsh
        run: |
          npm run verify:assist-package
          if ($LASTEXITCODE -ne 0) { throw 'Packaged native integrity verification failed.' }
          $env:PALISADE_WINDOW_SMOKE_ASAR = (Resolve-Path 'out/win-unpacked/resources/app.asar').Path
          try {
            npm run test:window-controls
            if ($LASTEXITCODE -ne 0) { throw 'Packaged window controls verification failed.' }
          } finally {
            Remove-Item Env:PALISADE_WINDOW_SMOKE_ASAR -ErrorAction SilentlyContinue
          }
      - name: Sign update manifest
        shell: pwsh
        env:
          PALISADE_UPDATE_SIGNING_KEY_B64: ${{ secrets.PALISADE_UPDATE_SIGNING_KEY_B64 }}
          PALISADE_UPDATE_LEGACY_SIGNING_KEY_B64: ${{ secrets.PALISADE_UPDATE_LEGACY_SIGNING_KEY_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:PALISADE_UPDATE_SIGNING_KEY_B64) {
            throw 'PALISADE_UPDATE_SIGNING_KEY_B64 is not configured.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'palisade-release-key.pem'
          $legacyKeyPath = Join-Path $env:RUNNER_TEMP 'palisade-legacy-release-key.pem'
          try {
            $keyBytes = [Convert]::FromBase64String($env:PALISADE_UPDATE_SIGNING_KEY_B64)
            [System.IO.File]::WriteAllBytes($keyPath, $keyBytes)
            $env:PALISADE_UPDATE_PRIVATE_KEY_FILE = $keyPath
            if ($env:PALISADE_UPDATE_LEGACY_SIGNING_KEY_B64) {
              [System.IO.File]::WriteAllBytes($legacyKeyPath, [Convert]::FromBase64String($env:PALISADE_UPDATE_LEGACY_SIGNING_KEY_B64))
              $env:PALISADE_UPDATE_LEGACY_PRIVATE_KEY_FILE = $legacyKeyPath
            }
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            node scripts/sign-release.cjs "out/Palisade-Setup-$version-x64.exe" out
            if ($LASTEXITCODE -ne 0) { throw 'Release signing failed.' }
            node scripts/verify-release.cjs out
            if ($LASTEXITCODE -ne 0) { throw 'Release verification failed.' }
          } finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $legacyKeyPath -Force -ErrorAction SilentlyContinue
          }
      - name: Include pinned manager in release assets
        shell: pwsh
        run: |
          $manager = Get-Content assets/manager-release.json -Raw | ConvertFrom-Json
          Copy-Item -LiteralPath (Join-Path '.manager' $manager.filename) -Destination (Join-Path 'out' $manager.filename)
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-release
          path: |
            out/Palisade-Setup-*-x64.exe
            out/release.json
            out/release-v2.json
            out/release-v3.json
            out/SHA256SUMS
            out/Palisade-Manager-*-x64.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: signed-windows-release
          path: out
      - name: Verify signed artifacts before publishing
        run: node scripts/verify-release.cjs out
      - name: Publish to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $manager = Get-Content assets/manager-release.json -Raw | ConvertFrom-Json
          node -e "require('./scripts/bundle-manager.cjs').verifyManager(require('node:path').join('out', require('./assets/manager-release.json').filename)).catch(e => { console.error(e.message); process.exitCode = 1; })"
          if ($LASTEXITCODE -ne 0) { throw 'Release manager verification failed.' }
          $existing = gh release view $tag --json isDraft,targetCommitish | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0) {
            if (-not $existing.isDraft -or $existing.targetCommitish -ne $env:GITHUB_SHA) { throw 'Refusing to modify an existing release or an unrelated draft.' }
            gh release upload $tag "out/Palisade-Setup-$version-x64.exe" "out/release.json" "out/release-v2.json" "out/release-v3.json" "out/SHA256SUMS" (Join-Path 'out' $manager.filename) --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
            gh release edit $tag --draft=false --latest
          } else {
            gh release create $tag "out/Palisade-Setup-$version-x64.exe" "out/release.json" "out/release-v2.json" "out/release-v3.json" "out/SHA256SUMS" (Join-Path 'out' $manager.filename) --title "Palisade Desktop v$version" --notes-file "docs/RELEASE-$version.md" --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
