[package]
name = "palisade-update-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "Apache-2.0"
description = "Narrow, offline Palisade installer verification and handoff"

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=3.0.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading",
  "Win32_System_RemoteDesktop", "Win32_System_Registry", "Win32_System_Com",
  "Win32_System_Console", "Win32_System_Pipes", "Win32_UI_Shell",
  "Win32_System_IO", "Win32_System_Ioctl", "Wdk_Foundation", "Wdk_Storage_FileSystem"
] }

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = true
