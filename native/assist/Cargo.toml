[package]
name = "palisade-assist-guardian"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "Apache-2.0"
description = "Per-user Palisade Assist endpoint, disabled pending qualification"

[features]
default = []
native-input = []
native-resources = []

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=3.0.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
zeroize = "=1.9.1"
sha2 = { version = "=0.11.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_RemoteDesktop",
  "Win32_System_Threading", "Win32_System_Console", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_StationsAndDesktops", "Win32_Networking_WinHttp", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_Controls_Dialogs", "Win32_Security_Authorization", "Win32_System_WindowsProgramming",
  "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = true
